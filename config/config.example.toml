# Argus-Panoptes Configuration
# Copy to config.toml and customize.
# If this file contains API keys, restrict permissions: chmod 600 config.toml

# --- Coordinator ---
port = 18080
agent_urls = [
    "http://localhost:9001",  # research
    "http://localhost:9002",  # writing
    "http://localhost:9003",  # planning
    "http://localhost:9004",  # review
    "http://localhost:9005",  # testing
    "http://localhost:9006",  # coding
]

# Optional timeout for coordinator -> agent HTTP calls.
# Omit this key for no timeout (recommended for long-running streaming tasks).
# delegate_timeout_ms = 300000

# --- Triage (coordinator classification) ---
[triage]
# Providers: "openai" (also works for Ollama), "anthropic"
provider = "openai"
model = "lfm2:24b"
api_url = "http://localhost:11434"
timeout_ms = 30000
# api_key = "sk-..."  # Or use OPENAI_API_KEY / ANTHROPIC_API_KEY env vars.

# --- LLM (specialist agent generation) ---
[llm]
provider = "openai"
model = "lfm2:24b"
api_url = "http://localhost:11434"
max_concurrent_requests = 2
# api_key = ""

[llm.retry]
max_retries = 3
initial_delay_ms = 500
max_delay_ms = 30000
backoff_multiplier = 2.0

# --- Search (research agent) ---
[search]
url = "http://localhost:8888"
max_results = 5

# --- Memory (shared path) ---
[memory]
db_path = "./data/memory"
embedding_model = "all-MiniLM-L6-v2"
max_context_tokens = 4096

[memory.working]
size = 20
