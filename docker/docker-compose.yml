# Argus-Panoptes Docker Compose (A2A architecture)

services:
  coordinator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: panoptes-coordinator
    command: ["panoptes-coordinator"]
    environment:
      - RUST_LOG=info,panoptes=debug
      - PANOPTES_CONFIG=/app/config/default.toml
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ../config:/app/config:ro
      - panoptes-data:/app/data
    ports:
      - "18080:18080"
    networks:
      - panoptes-net
    restart: unless-stopped
    depends_on:
      - research
      - writing
      - planning
      - review
      - testing
      - coding
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  research:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: panoptes-research
    command: ["panoptes-research"]
    environment:
      - RUST_LOG=info,panoptes=debug
      - PANOPTES_CONFIG=/app/config/default.toml
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ../config:/app/config:ro
      - panoptes-data:/app/data
    ports:
      - "9001:9001"
    networks:
      - panoptes-net
    restart: unless-stopped

  writing:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: panoptes-writing
    command: ["panoptes-writing"]
    environment:
      - RUST_LOG=info,panoptes=debug
      - PANOPTES_CONFIG=/app/config/default.toml
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ../config:/app/config:ro
      - panoptes-data:/app/data
    ports:
      - "9002:9002"
    networks:
      - panoptes-net
    restart: unless-stopped

  planning:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: panoptes-planning
    command: ["panoptes-planning"]
    environment:
      - RUST_LOG=info,panoptes=debug
      - PANOPTES_CONFIG=/app/config/default.toml
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ../config:/app/config:ro
      - panoptes-data:/app/data
    ports:
      - "9003:9003"
    networks:
      - panoptes-net
    restart: unless-stopped

  review:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: panoptes-review
    command: ["panoptes-review"]
    environment:
      - RUST_LOG=info,panoptes=debug
      - PANOPTES_CONFIG=/app/config/default.toml
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ../config:/app/config:ro
      - panoptes-data:/app/data
    ports:
      - "9004:9004"
    networks:
      - panoptes-net
    restart: unless-stopped

  testing:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: panoptes-testing
    command: ["panoptes-testing"]
    environment:
      - RUST_LOG=info,panoptes=debug
      - PANOPTES_CONFIG=/app/config/default.toml
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ../config:/app/config:ro
      - panoptes-data:/app/data
    ports:
      - "9005:9005"
    networks:
      - panoptes-net
    restart: unless-stopped

  coding:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: panoptes-coding
    command: ["panoptes-coding"]
    environment:
      - RUST_LOG=info,panoptes=debug
      - PANOPTES_CONFIG=/app/config/default.toml
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ../config:/app/config:ro
      - panoptes-data:/app/data
    ports:
      - "9006:9006"
    networks:
      - panoptes-net
    restart: unless-stopped

volumes:
  panoptes-data:
    driver: local

networks:
  panoptes-net:
    driver: bridge
