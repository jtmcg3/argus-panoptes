# Development overrides for docker-compose
# Usage: docker-compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up

x-dev-service: &dev-service
  build:
    target: builder
  volumes:
    - ..:/app:cached
    - cargo-cache:/usr/local/cargo/registry
    - target-cache:/app/target
  environment:
    - RUST_BACKTRACE=1
    - RUST_LOG=debug,panoptes=trace
  read_only: false

services:
  coordinator:
    <<: *dev-service
    command: ["cargo", "run", "--bin", "panoptes-coordinator"]

  research:
    <<: *dev-service
    command: ["cargo", "run", "--bin", "panoptes-research"]

  writing:
    <<: *dev-service
    command: ["cargo", "run", "--bin", "panoptes-writing"]

  planning:
    <<: *dev-service
    command: ["cargo", "run", "--bin", "panoptes-planning"]

  review:
    <<: *dev-service
    command: ["cargo", "run", "--bin", "panoptes-review"]

  testing:
    <<: *dev-service
    command: ["cargo", "run", "--bin", "panoptes-testing"]

  coding:
    <<: *dev-service
    command: ["cargo", "run", "--bin", "panoptes-coding"]

volumes:
  cargo-cache:
  target-cache:
