[package]
name = "panoptes-agents"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Specialist agents for research, writing, planning, and coding"

[dependencies]
panoptes-common = { workspace = true }
panoptes-memory = { workspace = true }
panoptes-llm = { workspace = true }
panoptes-a2a = { workspace = true }
# MCP client (for calling tools + PTY client)
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# UUID generation
uuid = { workspace = true }

# HTTP client for web research
reqwest = { workspace = true }

# HTML parsing
scraper = { workspace = true }

# URL handling
url = { workspace = true }

# Configuration
toml = { workspace = true }

[[bin]]
name = "panoptes-research"
path = "src/bin/research.rs"

[[bin]]
name = "panoptes-writing"
path = "src/bin/writing.rs"

[[bin]]
name = "panoptes-planning"
path = "src/bin/planning.rs"

[[bin]]
name = "panoptes-review"
path = "src/bin/review.rs"

[[bin]]
name = "panoptes-testing"
path = "src/bin/testing.rs"

[[bin]]
name = "panoptes-coding"
path = "src/bin/coding.rs"
