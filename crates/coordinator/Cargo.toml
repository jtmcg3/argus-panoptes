[package]
name = "panoptes-coordinator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A2A triage coordinator for Argus-Panoptes"

[dependencies]
panoptes-common = { workspace = true }
panoptes-llm = { workspace = true }
panoptes-a2a = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client (for A2A calls to agents)
reqwest = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Configuration
toml = { workspace = true }

# UUID generation
uuid = { workspace = true }

# Broadcast channels for streaming
tokio-stream = { workspace = true }

[[bin]]
name = "panoptes-coordinator"
path = "src/bin/coordinator.rs"

[[bin]]
name = "panoptes-telegram"
path = "src/bin/telegram.rs"
